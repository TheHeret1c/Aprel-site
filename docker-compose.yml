services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./publish:/app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=choza_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Iiko__ApiLogin: ${IIKO_API_LOGIN}
      YandexMaps__ApiKey: ${YANDEX_MAPS_KEY}
      EmailSettings__Username: ${SMTP_USER}
      EmailSettings__Password: ${SMTP_PASSWORD}
      EmailSettings__From: ${SMTP_USER}
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: choza_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.24
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./cert:/etc/nginx/cert:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - pgadmin_logs:/var/log/pgadmin
    depends_on:
      - db
    restart: always

volumes:
  pgadmin_data:
  pgadmin_logs:
  postgres_data: